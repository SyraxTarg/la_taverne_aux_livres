name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  build-and-push:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Build the Docker image for backend
      run: |
        docker build ./backend --tag 20220796/tavern-backend:${{ github.sha }}
        docker build ./backend --tag 20220796/tavern-backend:${{ vars.APP_VERSION }}
    - name: Build the Docker image for frontend
      run: |
        docker build ./frontend --tag 20220796/tavern-frontend:${{ github.sha }}
        docker build ./frontend --tag 20220796/tavern-frontend:${{ vars.APP_VERSION }}

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Docker backend image
      run: |
        docker push 20220796/tavern-backend:${{ vars.APP_VERSION }}
        docker push 20220796/tavern-backend:${{ github.sha }}

    - name: Push Docker frontend image
      run: |
        docker push 20220796/tavern-frontend:${{ vars.APP_VERSION }}
        docker push 20220796/tavern-frontend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push]

    steps:

      - uses: actions/checkout@v4

      - name: Déployer via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          port: ${{ secrets.VM_PORT }}
          script: |
            cd ~/la_taverne_aux_livres
            git reset --hard
            git pull origin main
            export APP_VERSION=${{vars.APP_VERSION}}
            docker compose --file docker-compose.production.yaml pull
            docker compose --file docker-compose.production.yaml up -d