name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Vérifier les changements
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            frontend:
              - 'frontend/**'
              - 'docker-compose.production.yaml'
            backend:
              - 'backend/**'
              - 'docker-compose.production.yaml'

      - name: Install cargo from crates.io
        uses: baptiste0928/cargo-install@v3
        with:
          crate: cargo
          version: '^1.98.0'

      - name: backend unit tests
        run: |
          cargo test
  build-and-push:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Vérifier les changements
      uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          frontend:
            - 'frontend/**'
            - 'docker-compose.production.yaml'
          backend:
            - 'backend/**'
            - 'docker-compose.production.yaml'

    - name: Build the Docker image for backend
      if: steps.filter.outputs.backend == 'true'
      run: |
        docker build ./backend --tag 20220796/tavern-backend:${{ github.sha }}
        docker build ./backend --tag 20220796/tavern-backend:${{ vars.APP_VERSION }}
    - name: Build the Docker image for frontend
      if: steps.filter.outputs.frontend == 'true'
      run: |
        docker build ./frontend --tag 20220796/tavern-frontend:${{ github.sha }}
        docker build ./frontend --tag 20220796/tavern-frontend:${{ vars.APP_VERSION }}

    - name: Login to Docker Hub
      uses: docker/login-action@v3
      if: steps.filter.outputs.frontend == 'true' || steps.filter.outputs.backend == 'true'
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Push Docker backend image
      if: steps.filter.outputs.backend == 'true'
      run: |
        docker push 20220796/tavern-backend:${{ vars.APP_VERSION }}
        docker push 20220796/tavern-backend:${{ github.sha }}

    - name: Push Docker frontend image
      if: steps.filter.outputs.frontend == 'true'
      run: |
        docker push 20220796/tavern-frontend:${{ vars.APP_VERSION }}
        docker push 20220796/tavern-frontend:${{ github.sha }}

  deploy:
    runs-on: ubuntu-latest
    needs: [build-and-push]

    steps:

      - uses: actions/checkout@v4

      - name: Déployer via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          SECRETS_ENV: ${{ secrets.BACKEND_ENV }}
        with:
          host: ${{ secrets.VM_HOST }}
          username: ${{ secrets.VM_USER }}
          password: ${{ secrets.VM_PASSWORD }}
          port: ${{ secrets.VM_PORT }}
          envs: SECRETS_ENV
          script: |
            cd ~/la_taverne_aux_livres
            git reset --hard
            git pull origin main
            export APP_VERSION=${{vars.APP_VERSION}}
            echo "$SECRETS_ENV" > backend/.env
            docker compose --file docker-compose.production.yaml pull
            docker compose --file docker-compose.production.yaml up -d