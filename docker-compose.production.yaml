services:
  postgres:
    image: postgres:16
    container_name: postgres
    hostname: postgres
    ports:
      - "5445:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: tavern
      POSTGRES_PASSWORD: root

  backend:
    image: 20220796/tavern-backend:1.0.0
    container_name: backend
    ports:
      - "3000:3000"
    depends_on:
      - postgres
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=postgresql://postgres:root@postgres:5432/tavern
    volumes:
      - fastembed-cache:/home/appuser/.fastembed_cache

  frontend:
    image: 20220796/tavern-frontend:1.0.0
    ports:
      - "4321:4321"
    environment:
      - HOST=0.0.0.0
      - API_URL=http://backend:3000/api
    depends_on:
      - backend

volumes:
  fastembed-cache:
